name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_RETENTION_COUNT: '5'

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a9 # v9
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Test and enforce coverage
        run: ./scripts/check-coverage.sh

      - name: Vet
        run: go vet ./...

      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: VERSION="${VERSION#v}" ./scripts/build-release.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "cdt $RELEASE_TAG" \
            --generate-notes

      - name: Remove stale release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/cleanup-release-assets.sh
